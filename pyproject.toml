[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cat-pol"
dynamic = ["version"]
description = "Policy document classification powered by LLMs"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
keywords = ["llm", "policy", "classification", "text analysis", "document analysis"]
authors = [
  { name = "Chris Soria", email = "chrissoria@berkeley.edu" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
  "cat-stack>=0.1.0",
  "pandas",
]

[project.optional-dependencies]
pdf = ["cat-stack[pdf]"]
embeddings = ["cat-stack[embeddings]"]
sources = ["datasets>=2.14.0", "huggingface_hub>=0.16.0"]

[project.urls]
Documentation = "https://github.com/chrissoria/cat-pol#readme"
Issues = "https://github.com/chrissoria/cat-pol/issues"
Source = "https://github.com/chrissoria/cat-pol"

[tool.hatch.version]
path = "src/cat_pol/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cat_pol"]

[tool.hatch.build.targets.sdist]
include = [
    "src/cat_pol/**/*.py",
]
